<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>SimpleSite — Dark Template Manager</title>
  <link rel="stylesheet" href="styles.css">
  <!-- JSZip (for Download ZIP) -->
  <script src="https://cdn.jsdelivr.net/npm/jszip@3.10.0/dist/jszip.min.js"></script>
</head>
<body>
  <!-- LAYOUT: HEADER -->
  <header id="site-header">
    <button id="menu-toggle" aria-label="Toggle menu">☰</button>
    <h1 id="site-title">SimpleSite</h1>
    <nav id="top-actions">
      <button id="help-btn">Help</button>
      <button id="editor-toggle" title="Open editor">🔒 Editor</button>
    </nav>
  </header>

  <!-- LAYOUT: SIDEBAR -->
  <aside id="sidebar" role="navigation" aria-label="Site pages">
    <div class="sidebar-inner">
      <div class="sidebar-search">
        <input id="search-pages" placeholder="Search pages (Ctrl+F also works)" />
      </div>

      <nav id="pages-list">
        <!-- Menu is generated by script.js -->
      </nav>

      <hr />
      <div class="sidebar-foot">Edit pages in <code>script.js</code> — use Ctrl+F for tokens like <code>PAGES ARRAY</code> or <code>TEMPLATE:</code>
      <div style="margin-top:6px;color:var(--muted);font-size:12px">Editor: owner-only — you'll be prompted for the owner key when opening the editor.</div>
      </div>
    </div>
  </aside>

  <!-- MAIN CONTENT -->
  <main id="content" tabindex="-1">
    <!-- TEMPLATE: MAIN_CONTENT_START -->
    <div id="page-container">
      <!-- Page content is injected here -->
    </div>
    <!-- TEMPLATE: MAIN_CONTENT_END -->
  </main>

  <!-- EDITOR PANEL -->
  <div id="editor-panel" aria-hidden="true">
    <div class="editor-top">
      <div class="editor-title">SimpleSite Editor</div>
      <div class="editor-actions">
        <button id="editor-close">Close</button>
        <button id="download-script">Download script.js</button>
        <button id="download-zip">Download Site ZIP</button>
      </div>
    </div>

    <div class="editor-body">
      <div class="editor-left">
        <div class="editor-left-controls">
          <button id="add-page">+ Add Page</button>
          <button id="add-subpage" disabled>+ Add Subpage</button>
        </div>
        <div id="editor-pages-list" class="editor-pages-list">
          <!-- pages tree -->
        </div>
      </div>

      <div class="editor-right">
        <form id="editor-form">
          <input type="hidden" id="editor-path" value="">
          <label>Page ID (unique)
            <input id="field-id" />
          </label>
          <label>Title
            <input id="field-title" />
          </label>
          <label>Type
            <select id="field-type">
              <option value="text">text</option>
              <option value="url">url</option>
              <option value="raw">raw</option>
            </select>
          </label>

          <div id="type-text-fields" class="type-fields">
            <label>Header
              <input id="field-header" />
            </label>
            <label>Subheader
              <input id="field-subheader" />
            </label>
            <label>Image URL
              <input id="field-image" />
            </label>
            <label>Body (HTML accepted)
              <textarea id="field-text" rows="8"></textarea>
            </label>
          </div>

          <div id="type-url-fields" class="type-fields" style="display:none">
            <label>URL
              <input id="field-url" />
            </label>
          </div>

          <div id="type-raw-fields" class="type-fields" style="display:none">
            <label>Raw HTML
              <textarea id="field-raw" rows="10"></textarea>
            </label>
          </div>

          <div class="editor-form-actions">
            <button id="save-page" type="button">Save changes</button>
            <button id="delete-page" type="button">Delete page</button>
            <button id="move-up" type="button">Move up</button>
            <button id="move-down" type="button">Move down</button>
            <button id="preview-page" type="button">Preview</button>
          </div>

          <div class="editor-hint">
            Tip: Use the PAGES ARRAY token in script.js to edit pages by hand. Editor changes update the in-memory pages and allow you to Download the updated script.js.
          </div>
        </form>
      </div>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
